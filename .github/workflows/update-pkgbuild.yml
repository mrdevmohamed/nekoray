name: AUR CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '!.github/workflows/**'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    steps:
      - name: Skip AUR publish when deploy key is not configured
        if: env.DEPLOY_KEY == ''
        run: 'echo "AUR publish skipped: configure the DEPLOY_KEY repository secret to enable it."'

      - name: Validate AUR deploy key
        if: env.DEPLOY_KEY != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          if ! ssh-keygen -y -P "" -f "$key_file" >/dev/null 2>&1; then
            echo "::error::DEPLOY_KEY is not a valid unencrypted OpenSSH/PEM private key. Replace the repository secret with the complete private key, including its BEGIN/END lines."
            exit 1
          fi

      - name: Update AUR package
        if: env.DEPLOY_KEY != ''
        uses: chitang233/aur-pkgbuild-builder@d44ae80e4bd09d6ba29fb5f36937529473212886
        with:
          deploy_key: ${{ env.DEPLOY_KEY }}
          package_name: 'nekoray-git'
